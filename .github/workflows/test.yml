# shellcheck + testes rápidos, sem internet: só leem o repositório, nada de downloads.
# A instalação completa (4 distros × desktop e servidor) roda na máquina de quem faz o PR,
# pelo tools/ci.sh, que no fim marca o commit com o status "signoff" que a main exige.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: tests/lint.sh

  testes:
    name: testes (sem internet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Detecção do modo, passos, sem terminal e versions.lock
        run: tests/rapidos.sh
