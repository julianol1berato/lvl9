# lvl9: o firmware-notifier (snap firmware-updater) aborta quando não há serviço de
# notificações no D-Bus da sessão. Isso acontece quando o timer dele dispara antes do login
# gráfico (usuário com linger, tela de login) e deixa a unidade marcada como falha.
# Aqui a execução é pulada nesse caso; o timer tenta de novo mais tarde.
[Service]
ExecCondition=/bin/sh -c 'busctl --user call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus NameHasOwner s org.freedesktop.Notifications | grep -q true'
