# shellcheck + testes rápidos, sem internet: só leem o repositório, nada de downloads.
# A instalação completa (4 distros × desktop e servidor) baixa as ferramentas e por isso
# roda só local, em Docker: tests/docker.sh.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x -S warning --shell=bash boot.sh install.sh bin/lvl9 lib/*.sh install/*.sh \
            tools/*.sh tests/*.sh config/bash/rc config/bash/prompt.bash \
            -e SC2034,SC2088,SC2164

  testes:
    name: testes (sem internet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Detecção do modo, passos, sem terminal e versions.lock
        run: tests/rapidos.sh
